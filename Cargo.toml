[workspace]
resolver = "2"
members = ["crates/pcr-auth", "crates/pcr-web", "crates/pcr-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cofe/pcr-login-tools"

[workspace.dependencies]
pcr-auth = { path = "crates/pcr-auth" }
pcr-web = { path = "crates/pcr-web" }

aes = "0.8"
axum = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
clap = { version = "4", features = ["derive"] }
generic-array = "0.14"
md-5 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
rmpv = "1"
rsa = { version = "0.9", features = ["pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
