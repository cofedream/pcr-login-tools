name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# 同一分支的新推送取消旧构建，省额度
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux：musl 静态链接，不依赖目标机器的 glibc 版本
          - name: pcr-auth-linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            apt: musl-tools
          # Windows：原生 MSVC 工具链，不需要交叉编译
          - name: pcr-auth-windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # 想加 macOS 就直接补两条（首次可能因 runner 排队被取消，重跑即可）：
          # - name: pcr-auth-macos-arm64
          #   os: macos-14
          #   target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: 安装交叉编译工具链
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: 编译
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 校验 Linux 产物是纯静态
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/pcr-auth"
          file "$bin"
          if readelf -l "$bin" | grep -q INTERP; then
            echo "::error::产物带 PT_INTERP，依赖 musl loader，glibc 系统上跑不起来"
            readelf -l "$bin" | grep -A1 INTERP
            exit 1
          fi
          # 在只有 glibc 的环境里实跑一次：动态链接 musl 的产物会在这里失败
          docker run --rm -v "$PWD/$bin:/pcr-auth:ro" debian:12-slim /pcr-auth --version

      - name: 收集产物
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/pcr-auth"
          [ -f "${bin}.exe" ] && bin="${bin}.exe"
          out="dist/${{ matrix.name }}"
          case "$bin" in *.exe) out="${out}.exe" ;; esac
          mkdir -p dist
          cp "$bin" "$out"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
