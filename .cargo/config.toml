# 交叉编译时的链接器 / C 编译器设置。
#
# 这些配置只对对应 target 生效，本机原生构建（x86_64-unknown-linux-gnu 等）不受影响。
# 需要的工具链见 docs/build.md。
#
# 为什么需要 C 编译器：TLS 依赖 ring，它包含 C / 汇编实现，交叉编译时必须提供
# 对应目标平台的 C 工具链，否则会报 `failed to find tool "x86_64-linux-musl-gcc"`。

[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

[env]
# cc-rs 不读上面的 linker 配置，需要单独指定 C 编译器
CC_x86_64_unknown_linux_musl = "musl-gcc"
AR_x86_64_unknown_linux_musl = "ar"
CC_aarch64_unknown_linux_musl = "aarch64-linux-musl-gcc"
AR_aarch64_unknown_linux_musl = "aarch64-linux-musl-ar"
CC_x86_64_pc_windows_gnu = "x86_64-w64-mingw32-gcc"
AR_x86_64_pc_windows_gnu = "x86_64-w64-mingw32-ar"
