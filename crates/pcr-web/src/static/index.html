<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCR 登录 · 取令牌</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --card: #fff; --text: #1c1e21; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --ok: #059669; --warn: #b45309; --err: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --text: #e6e8eb; --muted: #9aa3af;
      --line: #262b35; --accent: #60a5fa; --ok: #34d399; --warn: #fbbf24; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 16px 72px; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub, .hint, .saved { color: var(--muted); font-size: 12px; }
  .path { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; word-break: break-all; }

  .toolbar { display: flex; align-items: center; gap: 8px; margin: 18px 0 12px; flex-wrap: wrap; }
  .grow { flex: 1; }

  button, .btn {
    padding: 7px 14px; border-radius: 8px; border: 1px solid transparent; cursor: pointer;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 13px;
    text-decoration: none; display: inline-block; line-height: 1.5;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost, .btn.ghost { background: transparent; color: var(--text); border-color: var(--line); font-weight: 500; }
  button.tiny { padding: 2px 9px; font-size: 12px; font-weight: 500; }
  button.link { background: none; border: none; color: var(--accent); padding: 0; font-weight: 500; text-decoration: underline; }

  .cards { display: grid; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .index { font-weight: 600; color: var(--muted); font-size: 12px; }

  .fields { display: grid; grid-template-columns: 1.2fr 1.2fr .8fr .8fr; gap: 10px; }
  @media (max-width: 720px) { .fields { grid-template-columns: 1fr 1fr; } }
  .fields label { display: flex; flex-direction: column; gap: 4px; }
  .fields label > span { font-size: 12px; color: var(--muted); }
  input, select {
    width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px;
    background: transparent; color: inherit; font: inherit;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  select { appearance: auto; }

  .card-actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  .pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); color: var(--muted); }
  .st-pending, .st-running { color: var(--accent); border-color: currentColor; }
  .st-need_captcha { color: var(--warn); border-color: currentColor; cursor: pointer; text-decoration: underline; }
  .st-done { color: var(--ok); border-color: currentColor; }
  .st-failed { color: var(--err); border-color: currentColor; }

  .result { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); display: grid; gap: 8px; }
  .kv { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; }
  .kv .k { color: var(--muted); font-size: 12px; }
  .cmdrow { display: flex; gap: 8px; align-items: flex-start; }
  .cmd { flex: 1; padding: 6px 8px; border-radius: 6px; background: rgba(127,127,127,.1); }
  .error { color: var(--err); font-size: 12px; margin: 10px 0 0; }
  .error details { margin-top: 6px; color: var(--muted); }
  .error summary { cursor: pointer; color: var(--muted); }
  .error pre {
    margin: 6px 0 0; padding: 8px; border-radius: 6px; background: rgba(127,127,127,.1);
    font: 11px/1.6 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all;
    color: var(--text);
  }
  .flash { color: var(--ok); }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 999px;
    font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <h1>公主连结 · 取令牌</h1>
  <p class="sub">只在本机运行。账号与令牌会保存在下面的数据文件里，密码为明文（文件权限 0600）。</p>
  <p class="path">数据文件：<code id="data-path">读取中…</code></p>

  <div class="toolbar">
    <button id="add">+ 添加账号</button>
    <button id="run-all" class="ghost">全部获取令牌</button>
    <span class="grow"></span>
    <label class="sub" style="display:flex;align-items:center;gap:6px">
      <input type="checkbox" id="name" checked style="width:auto"> 取昵称
    </label>
    <a class="btn ghost" href="/api/export.csv">导出 CSV</a>
  </div>

  <div id="cards" class="cards"></div>
  <p id="empty" class="hint">还没有账号，点「+ 添加账号」开始。</p>
</main>

<div id="toast" class="toast"></div>

<script>
"use strict";

const STATUS_TEXT = {
  idle: "未运行",
  pending: "排队中…",
  running: "登录中…",
  need_captcha: "点此完成验证 →",
  done: "成功",
  failed: "失败",
};

const state = {
  cards: new Map(),     // accountId -> card element
  jobs: new Map(),      // accountId -> latest job view
  timers: new Map(),    // card element -> save timer
};

const $ = (selector) => document.querySelector(selector);

function toast(text) {
  const el = $("#toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove("show"), 2200);
}

async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) {
    const text = await response.text();
    throw new Error(text || "HTTP " + response.status);
  }
  const text = await response.text();
  return text ? JSON.parse(text) : null;
}

function bindCommand(account) {
  if (!account.token) return null;
  const prefix = account.channel === "qu" ? "渠绑定账号" : "B绑定账号";
  return prefix + " " + account.token.uid + " " + account.token.access_key;
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  const helper = document.createElement("textarea");
  helper.value = text;
  helper.style.position = "fixed";
  helper.style.opacity = "0";
  document.body.append(helper);
  helper.select();
  document.execCommand("copy");
  helper.remove();
  return Promise.resolve();
}

// ------------------------------------------------------------------ 卡片

const CARD_TEMPLATE = `
  <div class="card-head">
    <span class="index"></span>
    <span class="saved" hidden>已保存</span>
    <span class="grow"></span>
    <span class="pill st-idle">未运行</span>
    <button class="ghost tiny remove">删除</button>
  </div>
  <div class="fields">
    <label><span>账号</span><input class="account" autocomplete="off" spellcheck="false" placeholder="B站手机号 / 邮箱"></label>
    <label><span>密码</span><input class="password" type="password" autocomplete="off" spellcheck="false"></label>
    <label><span>平台</span><select class="platform"><option value="android">Android</option><option value="ios">iOS</option></select></label>
    <label><span>渠道</span><select class="channel"><option value="bilibili">官服</option><option value="qu">渠道服</option></select></label>
  </div>
  <div class="card-actions">
    <button class="run">获取令牌</button>
    <button class="ghost tiny toggle-password">显示密码</button>
    <span class="grow"></span>
    <span class="updated sub"></span>
  </div>
  <p class="error" hidden></p>
  <div class="result" hidden></div>
`;

function readCard(card) {
  return {
    account: card.querySelector(".account").value,
    password: card.querySelector(".password").value,
    platform: card.querySelector(".platform").value,
    channel: card.querySelector(".channel").value,
  };
}

function createCard(account) {
  const card = document.createElement("article");
  card.className = "card";
  card.innerHTML = CARD_TEMPLATE;

  const saved = account || { channel: "bilibili", platform: "android" };
  card.querySelector(".account").value = saved.account || "";
  card.querySelector(".password").value = saved.password || "";
  card.querySelector(".platform").value = saved.platform || "android";
  card.querySelector(".channel").value = saved.channel || "bilibili";

  if (saved.id) {
    card.dataset.id = saved.id;
    state.cards.set(saved.id, card);
  } else {
    card.dataset.draft = "1";
  }

  card.querySelectorAll("input.account, input.password, select.platform, select.channel")
    .forEach((input) => {
      input.addEventListener("input", () => scheduleSave(card));
      input.addEventListener("change", () => scheduleSave(card));
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          runCard(card);
        }
      });
    });

  card.querySelector(".toggle-password").onclick = () => {
    const input = card.querySelector(".password");
    const hidden = input.type === "password";
    input.type = hidden ? "text" : "password";
    card.querySelector(".toggle-password").textContent = hidden ? "隐藏密码" : "显示密码";
  };

  card.querySelector(".remove").onclick = () => removeCard(card);
  card.querySelector(".run").onclick = () => runCard(card);

  if (account && account.token) {
    renderResult(card, {
      viewer_id: account.token.viewer_id,
      user_name: account.token.user_name,
      command: bindCommand(account),
      fetched_at: account.token.fetched_at,
    });
  }

  $("#cards").append(card);
  renumber();
  $("#empty").hidden = true;
  return card;
}

function renumber() {
  [...$("#cards").children].forEach((card, index) => {
    card.querySelector(".index").textContent = "#" + (index + 1);
  });
  $("#empty").hidden = $("#cards").children.length > 0;
}

function scheduleSave(card) {
  clearTimeout(state.timers.get(card));
  const timer = setTimeout(() => saveCard(card), 600);
  state.timers.set(card, timer);
}

async function saveCard(card) {
  state.timers.delete(card);
  const payload = readCard(card);
  if (!payload.account.trim()) return;

  try {
    let account;
    if (card.dataset.draft === "1") {
      account = await api("/api/accounts", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload),
      });
      delete card.dataset.draft;
      card.dataset.id = account.id;
      state.cards.set(account.id, card);
    } else {
      account = await api("/api/accounts/" + encodeURIComponent(card.dataset.id), {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload),
      });
    }

    const saved = card.querySelector(".saved");
    saved.hidden = false;
    clearTimeout(saved.timer);
    saved.timer = setTimeout(() => { saved.hidden = true; }, 1200);

    if (account && account.token) {
      renderResult(card, {
        viewer_id: account.token.viewer_id,
        user_name: account.token.user_name,
        command: bindCommand(account),
        fetched_at: account.token.fetched_at,
      });
    }
  } catch (error) {
    toast("保存失败：" + error.message);
  }
}

async function removeCard(card) {
  const id = card.dataset.id;
  if (id) {
    try {
      await api("/api/accounts/" + encodeURIComponent(id), { method: "DELETE" });
    } catch (error) {
      toast("删除失败：" + error.message);
      return;
    }
    state.cards.delete(id);
  }
  card.remove();
  renumber();
}

async function runCard(card) {
  clearTimeout(state.timers.get(card));
  const payload = readCard(card);
  if (!payload.account.trim() || !payload.password) {
    toast("请先填写账号和密码");
    return;
  }

  const id = card.dataset.id;
  if (!id || card.dataset.draft === "1") {
    await saveCard(card);
  }
  const accountId = card.dataset.id;
  if (!accountId) return;

  try {
    await api("/api/jobs", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ ids: [accountId], fetch_name: $("#name").checked }),
    });
    setPill(card, "pending");
    poll();
  } catch (error) {
    toast("启动失败：" + error.message);
  }
}

async function runAll() {
  const ids = [];
  for (const card of $("#cards").children) {
    const payload = readCard(card);
    if (!payload.account.trim() || !payload.password) continue;
    clearTimeout(state.timers.get(card));
    await saveCard(card);
    if (card.dataset.id) ids.push(card.dataset.id);
  }

  if (ids.length === 0) {
    toast("没有填写完整的账号");
    return;
  }

  try {
    await api("/api/jobs", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ ids, fetch_name: $("#name").checked }),
    });
    poll();
  } catch (error) {
    toast("启动失败：" + error.message);
  }
}

// ------------------------------------------------------------------ 结果

function setPill(card, status, message) {
  const pill = card.querySelector(".pill");
  pill.textContent = STATUS_TEXT[status] || status;
  pill.className = "pill st-" + status;
  pill.onclick = null;
  pill.title = message || "";
}

function renderResult(card, data) {
  if (!data.command && !data.viewer_id) return;

  const box = card.querySelector(".result");
  box.hidden = false;
  box.innerHTML = "";

  const kv = document.createElement("div");
  kv.className = "kv";
  const add = (key, value) => {
    if (!value) return;
    const k = document.createElement("span");
    k.className = "k";
    k.textContent = key;
    const v = document.createElement("code");
    v.textContent = value;
    kv.append(k, v);
  };
  add("viewer_id", data.viewer_id);
  add("昵称", data.user_name);
  if (data.fetched_at) add("获取时间", new Date(Number(data.fetched_at)).toLocaleString());

  const row = document.createElement("div");
  row.className = "cmdrow";
  const command = document.createElement("code");
  command.className = "cmd";
  command.textContent = data.command || "";
  const button = document.createElement("button");
  button.className = "ghost tiny";
  button.textContent = "复制";
  button.onclick = () => copyText(data.command).then(() => {
    button.textContent = "已复制";
    setTimeout(() => { button.textContent = "复制"; }, 1200);
  });
  row.append(command, button);

  box.append(kv, row);
}

function showError(card, message, notes) {
  const line = card.querySelector(".error");
  line.innerHTML = "";

  const text = document.createElement("div");
  text.textContent = message || "登录失败";
  line.append(text);

  if (notes && notes.length > 0) {
    const details = document.createElement("details");
    const summary = document.createElement("summary");
    summary.textContent = "诊断信息（" + notes.length + " 条）";
    const pre = document.createElement("pre");
    pre.textContent = notes.join("\n");
    details.append(summary, pre);
    line.append(details);
  }

  line.hidden = false;
}

function clearError(card) {
  const line = card.querySelector(".error");
  line.hidden = true;
  line.innerHTML = "";
}

// ------------------------------------------------------------------ 轮询

async function poll() {
  let payload;
  try {
    payload = await api("/api/jobs");
  } catch {
    return;
  }

  for (const job of payload.jobs || []) {
    const card = state.cards.get(job.account_id);
    if (!card) continue;

    state.jobs.set(job.account_id, job);
    setPill(card, job.status, job.message);

    if (job.status === "need_captcha" && job.captcha_url) {
      const pill = card.querySelector(".pill");
      pill.onclick = () => window.open(job.captcha_url, "_blank", "noopener");
    }

    if (job.status === "failed") {
      showError(card, job.message, job.notes);
    } else if (job.status === "done") {
      clearError(card);
      if (card.dataset.renderedJob !== job.id) {
        card.dataset.renderedJob = job.id;
        renderResult(card, {
          viewer_id: job.viewer_id,
          user_name: job.user_name,
          command: job.bind_command,
          fetched_at: Date.now(),
        });
      }
    } else {
      clearError(card);
    }
  }
}

async function load() {
  try {
    const payload = await api("/api/accounts");
    $("#data-path").textContent = payload.data_path;
    for (const account of payload.accounts || []) {
      if (state.cards.has(account.id)) continue;
      createCard(account);
    }
    renumber();
  } catch (error) {
    $("#data-path").textContent = "读取失败：" + error.message;
  }
}

$("#add").onclick = () => {
  const card = createCard(null);
  card.querySelector(".account").focus();
};
$("#run-all").onclick = runAll;

load().then(poll);
setInterval(poll, 1000);
</script>
</body>
</html>
